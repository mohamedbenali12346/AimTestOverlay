name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir buildsrc
          unzip AimTestOverlayAndroid_Project.zip -d buildsrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug
        working-directory: buildsrc

      - uses: actions/upload-artifact@v4
        with:
          name: AimTestOverlay-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
